apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_1_7
    targetCompatibility = JavaVersion.VERSION_1_7
}

sourceSets {
    main {
        resources.srcDirs = ['../symja_android_library/src/main/resources']
        java.srcDirs += '../symja_android_library/matheclipse-core/src/main/java/'
        java.srcDirs += '../symja_android_library/matheclipse-frontend/src/main/java/'
        java.srcDirs += "../symja_android_library/matheclipse-api/src/main/java/"
        java.srcDirs += "../symja_android_library/matheclipse-io/src/main/java/"
    }
    test {
        java.srcDirs += "../symja_android_library/matheclipse-core/src/test/java/"
        java.srcDirs += "../symja_android_library/matheclipse-api/src/test/java/"
        java.srcDirs += "../symja_android_library/matheclipse-io/src/test/java/"
        java.srcDirs += "../symja_android_library/tools/src/main/java/"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jsoup:jsoup:1.13.1'
    testImplementation group: 'commons-io', name: 'commons-io', version: '2.7'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.11.0'
    implementation 'com.atlassian.commonmark:commonmark:0.15.0'
    implementation 'com.atlassian.commonmark:commonmark-ext-gfm-tables:0.15.0'
}